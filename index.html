<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteMás - Local Notes</title>
    <meta name="description" content="An offline note taking application.">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <div id="folder-overlay" class="folder-overlay">
        <div class="folder-prompt">
            <h2>Welcome to NoteMás</h2>
            <p id="folder-message">To use this app completely offline and save to separate files, please grant access to the "nts" folder on
                your device.</p>
            <button id="open-folder-btn" class="btn-primary" style="margin: 20px auto;">
                Select Notes Folder
            </button>
        </div>
    </div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-header-left">
                    <h1>NoteMás</h1>
                    <button id="change-folder-btn" class="btn-icon sidebar-folder-btn" aria-label="Choose notes folder"
                        title="Choose notes folder">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.1a2.5 2.5 0 0 1 1.8.8L12.4 7H18.5A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-9z"></path>
                            <path d="M8 12h8"></path>
                            <path d="M12 8v8"></path>
                        </svg>
                    </button>
                </div>
                <button id="new-note-btn" class="btn-primary" aria-label="Create new note">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    New Note
                </button>
            </div>
            <div class="notes-list" id="notes-list">
                <!-- Notes will be injected here -->
            </div>
        </aside>

        <!-- Main Editor Area -->
        <main class="editor-area">
            <div class="editor-placeholder" id="editor-placeholder">
                <div class="placeholder-content">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round" class="placeholder-icon">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                    <h2>Select a note or create a new one</h2>
                    <p>All your notes are saved securely inside your "nts" folder.</p>
                </div>
            </div>

            <div class="editor-content hidden" id="editor-content">
                <header class="editor-header">
                    <div class="editor-header-inputs">
                        <input type="text" id="note-category-input" class="note-category-input"
                            placeholder="Category (e.g., Work)" aria-label="Note category" list="category-options"
                            spellcheck="true">
                        <datalist id="category-options"></datalist>
                        <input type="text" id="note-title-input" class="note-title-input" placeholder="Note Title..."
                            aria-label="Note title" spellcheck="true">
                    </div>
                    <div class="editor-header-actions">
                        <div class="font-settings-container">
                            <button id="font-settings-btn" class="btn-icon" aria-label="Change note font"
                                title="Change note font">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="3"></circle>
                                    <path d="M12 2v2.2M12 19.8V22M4.93 4.93l1.56 1.56M17.51 17.51l1.56 1.56M2 12h2.2M19.8 12H22M4.93 19.07l1.56-1.56M17.51 6.49l1.56-1.56"></path>
                                </svg>
                            </button>
                            <div id="note-font-menu" class="font-settings-menu hidden">
                                <label class="font-setting-group">
                                    <span>Font</span>
                                    <select id="note-font-select" class="note-font-select" aria-label="Select note font"></select>
                                </label>
                                <label class="font-setting-group">
                                    <span>Size</span>
                                    <select id="note-font-size-select" class="note-font-size-select" aria-label="Select note font size">
                                        <option value="14px">Small</option>
                                        <option value="16px">Medium</option>
                                        <option value="18px">Large</option>
                                        <option value="22px">XL</option>
                                        <option value="28px">XXL</option>
                                    </select>
                                </label>
                            </div>
                        </div>
                        <button id="export-note-btn" class="btn-icon" aria-label="Export note"
                            title="Export note as .txt">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                        </button>
                        <button id="delete-note-btn" class="btn-icon danger" aria-label="Delete note"
                            title="Delete note">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path
                                    d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                                </path>
                            </svg>
                        </button>
                    </div>
                </header>
                <textarea id="note-body-input" class="note-body-input" placeholder="Start typing your note here..."
                    aria-label="Note body" spellcheck="true"></textarea>
                <div class="editor-footer">
                    <span id="last-saved-indicator" class="save-status">Saved to file</span>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>

</html>
